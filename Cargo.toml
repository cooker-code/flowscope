[workspace]
members = [
    "crates/flowscope-core",
    "crates/flowscope-wasm",
    "crates/flowscope-cli",
    "crates/flowscope-export",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
authors = ["PondPilot Team"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pondpilot/flowscope"

[workspace.dependencies]
flowscope-core = { version = "0.7.0", path = "crates/flowscope-core", default-features = false }
flowscope-export = { version = "0.7.0", path = "crates/flowscope-export", default-features = false }
sqlparser = "0.61"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = { version = "1.1", features = ["preserve_order"] }
wasm-bindgen = "0.2"

# Keep source locations for workspace crates without generating full dependency
# debuginfo for every local development build.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = 0
